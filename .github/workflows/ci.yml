name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/finance_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production-min-32-chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server exec prisma generate

      - name: Deploy database migrations
        run: pnpm --filter server exec prisma migrate deploy

      - name: Run backend test suite
        run: pnpm test

      - name: Run classification evaluation
        run: pnpm --filter server run eval:classification

      - name: Run frontend lint
        run: pnpm --filter web lint

      - name: Run production build
        run: pnpm build
